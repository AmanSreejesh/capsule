[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capsule-cli"
dynamic = ["version"]
description = "Track the environment your project needs and flag changes to it in pull requests."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Aman Sreejesh" }]
requires-python = ">=3.11"
keywords = ["developer-tools", "environment-variables", "javascript", "typescript", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "typer>=0.12",
    # Upper bounds because tree-sitter's Python API still changes between 0.x releases.
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-javascript>=0.23,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
capsule = "capsule_cli.cli:app"

[project.urls]
Homepage = "https://github.com/AmanSreejesh/capsule"
Repository = "https://github.com/AmanSreejesh/capsule"
Issues = "https://github.com/AmanSreejesh/capsule/issues"

[tool.hatch.version]
path = "src/capsule_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/capsule_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
