[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capsule-cli"
dynamic = ["version"]
description = "Track the environment your project needs and flag changes to it in pull requests."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
capsule = "capsule_cli.cli:app"

[tool.hatch.version]
path = "src/capsule_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/capsule_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
