name: Capsule environment check
description: Check and report changes to a web project's environment requirements.
author: Aman Sreejesh

branding:
  icon: package
  color: purple

inputs:
  base:
    description: Git revision to compare with the pull request's capsule.json.
    required: false
    default: HEAD^
  comment:
    description: Maintain a Capsule report comment on pull requests (true or false).
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install Capsule
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"

    - name: Verify committed requirements
      shell: bash
      run: capsule capture --check

    - name: Build requirement report
      id: report
      shell: bash
      env:
        CAPSULE_BASE: ${{ inputs.base }}
      run: |
        report_file="$RUNNER_TEMP/capsule-report.md"
        printf '%s\n' '<!-- capsule-environment-report -->' > "$report_file"
        capsule diff --base "$CAPSULE_BASE" --format markdown | tee -a "$report_file"
        cat "$report_file" >> "$GITHUB_STEP_SUMMARY"

    - name: Update pull request comment
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        report_file="$RUNNER_TEMP/capsule-report.md"
        comment_id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
          --jq '.[] | select(.body | startswith("<!-- capsule-environment-report -->")) | .id' \
          | head -n 1)"
        if [ -n "$comment_id" ]; then
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
            --raw-field "body=$(cat "$report_file")" >/dev/null
        else
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --raw-field "body=$(cat "$report_file")" >/dev/null
        fi
